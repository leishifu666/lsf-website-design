- 拓扑表（写入提示词 §1）：页面模板 | 层级 | 归一化路径 | 抽样 URL | 取证深度（完整 / 轻 / 登记） | 入口来源。
- 路由与页面关系矩阵（写入提示词 §4.0）：行为来源页，列为目标页，单元格写入口组件与 PT 编号。
- SHELL-xx 规格（写入提示词 §4.1）；PT-xx（写入提示词 §6.7）。

