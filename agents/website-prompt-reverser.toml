同时写：预加载器是否存在、计数/进度来源（真实资源进度 或 假进度）、首屏可交互时刻、字体加载前后是否有布局跳动。

### 6.2 滚动叙事五项测试

每个区块都要跑：
1. 慢滚：滚轮每次约 100px，pin 区每 200px 截图一次，记录进度与画面对应。
2. 快滚：连续 5 次 PageDown，记录是否跳帧、是否有 snap、动画是否被跳过或追赶。
3. 反向：从页尾往回滚过每个 pin 区，记录是倒放、保持终态，还是重播。
4. 跳转：点页内锚点、按 Home/End，记录过渡方式与 pin 区状态是否正确。
5. 打断：pin 中途停住 2 秒、pin 中途改窗口宽度，记录是否错位、是否重新计算。

ScrollTrigger 可读时：
```js
ScrollTrigger.getAll().map(s => ({ trigger: s.trigger?.id || s.trigger?.className?.toString().slice(0, 50), start: s.start, end: s.end, pin: !!s.pin, pinSpacing: s.vars.pinSpacing, scrub: s.vars.scrub, snap: s.vars.snap, toggleActions: s.vars.toggleActions, once: s.vars.once }));
```

Lenis 参数不可读时，用滚动停止后位置收敛时间推断 `lerp` / `duration`，标 `【推断】`，并给 `【建议】` 值。

