  进度段      目标              属性                  from → to          ease
  0.00–0.25  .sec04-title     yPercent, opacity     100→0, 0→1          none
  0.15–0.60  M-1 uniform      uProgress             0→1                 none
  0.60–1.00  .sec04-card[i]   x, opacity            40→0, 0→1           power2.out, stagger 0.08
