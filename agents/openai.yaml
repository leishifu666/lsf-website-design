interface:
  display_name: "LSF-网站设计（基础版）"
  short_description: "自动判断基础版九种模式：风格参考、动画复刻、原创探索、独立评审与 DESIGN.md"
  default_prompt: "使用 $lsf-website-design，按交付物自动判断A/B/C/D/F/G/H/I/J。给定网址做新主题走 A，先侦察并判断核心动效、查机制与源码，按 source→prototype→paired 制作和对照；静态站不强塞 WebGL。完整网页每页至少 5 项真实源码复用，核心场景另验收。只复刻指定动画走 I，用内置 reanimate 采集并逐帧验证。提取或制作 DESIGN.md 走 J，按 Google 规范产出并用官方 CLI 验证。只读取当前任务需要的资料。"
