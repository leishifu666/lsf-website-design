## 9. 协议 E：面向下游的结构化转译

### 9.1 写作规则

- 祈使句，一行一个事实，带单位。
- 禁用模糊词：“适当”“稍微”“类似”“大概”“自然一点”“高级感”，除非后面紧跟数值。
- 所有对象有编号，跨节只引用编号；区块编号一律带页面前缀。
- 令牌只定义一次（提示词 §3），其他节只引用 `TK-xxx`。
- 所有数值同时给 1440 / 768 / 375 三端值，或写明共用。
- 节号引用写完整（如 `提示词 §6.7`），提交前按 §12 第 24 条逐一核对。

### 9.2 12 节固定结构与每节必填项

```
# 原站基准制作提示词：<参考站名>

