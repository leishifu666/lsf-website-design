## 5. 协议 A：技术栈与渲染管线逆向取证

对每个完整取证模板执行；跨页一致的结论只写一次并注明适用页面。

### 5.1 取证顺序

1. HTML 与 `<head>`：`<meta name="generator">`、`<link rel="preload">`（字体、模型、着色器、HDR）、`<script>` 路径特征、内联 JSON（`__NEXT_DATA__`、`__NUXT__`、`self.__next_f`）。
2. DOM 特征：`#__next`、`#___gatsby`、`astro-island`、`[data-astro-cid-*]`、`[data-v-app]`、`[data-wf-page]`、`[data-framer-name]`、`[data-barba]`、`html.lenis`、`[data-scroll-container]`。
3. 运行时全局对象：§5.2 探针。
4. 网络请求：按扩展名与域名分类，§5.4。
5. 公开 bundle 字符串检索：§5.4 签名表。只检索浏览器已下载的公开文件，不做绕过、不抓受限资源。
6. 样式体系：类名形态 + 样式表内容 + `:root` 自定义属性，§7.3。
7. 每个 canvas 的上下文与着色器，§5.3。
8. 汇总为五层结论表 + 每个渲染机制一份核心机制合同，§5.5。

