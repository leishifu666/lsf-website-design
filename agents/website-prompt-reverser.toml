## 10. 容易做错的地方与禁止事项
- 逐条：错误做法 → 正确做法（含数值）
- 固定包含：按钮 hover 上浮、图标 hover 位移、渲染降级、转场降级为直接跳页、路由切换不销毁 ScrollTrigger、返回不恢复滚动、手写 UI 图标、令牌写死、pin 后 resize 未 refresh、透明图白边、行末标点

