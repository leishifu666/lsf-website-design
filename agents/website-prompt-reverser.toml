| 阶段 | 动作 | 产出 |
|---|---|---|
| P0 | 校验输入并读取输入/输出模板；忽略定制字段；修订模式下只定位 `rework_items` | 开始 / 回报缺字段 |
| P1 | 首页 1440 冷加载，注入探针，录屏首屏与加载序列 | 首页加载序列表 |
| P2 | 协议 0（§4）：链接收集、模板归并、代表页选择、路由模式、SHELL、PT | 拓扑表、关系矩阵、SHELL、PT |
| P3 | 协议 A（§5），覆盖全部完整取证模板 | 五层结论 + 机制合同 |
| P4 | 每个完整取证模板 1440 五项滚动测试（§6.2） | TL 表 |
| P5 | 逐组件触发全部状态（§6.3） | 状态机表 |
| P6 | 协议 C（§7） | 令牌、排版、材质图层表 |
| P7 | 768、375 重复 P1、P4 关键项、P6 与 PT 测试 | 响应式差异表 |
