interface:
  display_name: "LSF-网站设计（基础版）"
  short_description: "AI自动判断基础版七种模式，默认贴近参考风格；支持原创探索和独立评审"
  default_prompt: "使用 $lsf-website-design，按任务自动判断A/B/C/D/F/G/H，不先让用户选模式。给定网址做新主题走A，先运行start-reference实查原站与六类行为，样段通过再逐区块制作、对照。没有URL时五站调研后自行选主参考。C原创探索接入构图方法库和种子。网页新图片调用Codex内置生图，透明素材显式开启透明，每条提示词追加指定画质句。更有趣的交互先找网站和开源源码；UI图标只用开源库。视觉评审优先Gemini/Claude，缺少可用渠道才用当前模型新子Agent，并通过Ego Lite实测和截图。明确首次安装本技能时读取首次安装与依赖，给三个必备免费组件链接；日常调用不重复安装提醒。"
