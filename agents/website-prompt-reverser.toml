### 5.3 Canvas 上下文与着色器探针

**首选（加载前注入）**：记录上下文类型、上下文属性、着色器源码、纹理上传数量。

```js
(() => {
  const P = (window.__probe = { ctx: [], shaders: [], texImage: 0, programs: 0 });
  const og = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    const c = og.call(this, type, attrs);
    if (c && !this.__probed) { this.__probed = 1; P.ctx.push({ type, attrs: attrs || null, w: this.width, h: this.height, url: location.pathname }); }
    return c;
  };
  for (const G of [window.WebGLRenderingContext, window.WebGL2RenderingContext].filter(Boolean)) {
    const ss = G.prototype.shaderSource, lp = G.prototype.linkProgram, ti = G.prototype.texImage2D;
    G.prototype.shaderSource = function (sh, src) { P.shaders.push(src.slice(0, 6000)); return ss.call(this, sh, src); };
    G.prototype.linkProgram = function (p) { P.programs++; return lp.apply(this, arguments); };
    G.prototype.texImage2D = function () { P.texImage++; return ti.apply(this, arguments); };
  }
})();
```

**次选（运行时）**：只对已确认正在绘制画面的 canvas 执行。对未初始化的 canvas 调用 `getContext` 会新建上下文并破坏页面，禁止对空白 canvas 执行。

```js
[...document.querySelectorAll('canvas')].map((c, i) => {
  for (const t of ['webgl2', 'webgl', 'webgpu', '2d', 'bitmaprenderer']) {
    let ctx = null; try { ctx = c.getContext(t); } catch (e) {}
    if (!ctx) continue;
    const out = { i, type: t };
    if (t.startsWith('webgl')) {
      const dbg = ctx.getExtension('WEBGL_debug_renderer_info');
      out.version = ctx.getParameter(ctx.VERSION);
      out.attrs = ctx.getContextAttributes();
      out.exts = ctx.getSupportedExtensions()?.filter(e => /float|color_buffer|instanced|draw_buffers|compressed/.test(e));
      out.renderer = dbg ? ctx.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null;
    }
    return out;
  }
  return { i, type: '未取得' };
});
```

着色器源码读取后提取：`#version`、`precision`、全部 `uniform`（名称 + 类型）、`attribute/in`、`varying/out`、关键函数（noise / fbm / smoothstep 遮罩 / 位移 / 色差 / 菲涅尔），以及 three.js 片段标记 `#include <common>`、`#include <tonemapping_fragment>` 等。提示词只写这些结构与参数含义，不整段搬运原着色器源码。

