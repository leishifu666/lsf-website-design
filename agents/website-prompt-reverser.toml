## 9. 技术栈与实现约束
- 五层结论表（原站事实）+ 本次实现选型（【建议】，与原站不同须写理由，渲染层与转场层不得降级）
- 依赖清单与锁定版本
- 路由架构：L1 静态路由、L2 动态路由与内容数据文件、共享 Shell 布局层、转场包装器、持久舞台挂载点
