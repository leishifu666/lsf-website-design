## 7. 协议 C：布局、排版与材质图层

### 7.1 布局

三视口、每个完整取证模板分别取：容器最大宽度、左右内边距、栅格列数与列间距、区块上下内边距、区块最小高度（px 与 vh）、元素间垂直节奏。

```js
(sel => [...document.querySelectorAll(sel)].map(e => { const s = getComputedStyle(e), r = e.getBoundingClientRect();
  return { sel: e.className.toString().slice(0, 50), x: r.x, y: r.y + scrollY, w: r.width, h: r.height, pad: s.padding, margin: s.margin, gap: s.gap, grid: s.gridTemplateColumns, maxW: s.maxWidth, display: s.display }; }))('section, main > *, header, footer');
```

### 7.2 排版

逐角色（display / h1 / h2 / h3 / body-lg / body / caption / label / button / nav）取：`font-family`、字重、`font-size`、`line-height`、`letter-spacing`、`text-transform`、`font-feature-settings`、`font-variation-settings`。

- 字体文件：由网络 woff2 请求取文件名与托管源；字体名写全称。
- 流式字号：两视口以上实测后推出 `clamp(min, a + b·vw, max)`，标 `【推断：375 与 1440 实测插值】`。
- 商业字体或许可不明：写原字体名 `【实测】`，再给开源替代 `【建议】`（字形骨架接近、字重齐全），并写替代后需要调整的字距与行高。
- 原站有中文页面或中英混排时，分别记录中文字体族与西文字体族的回退顺序。
- 分行动画（SplitText 类）：写拆分单位（字符 / 词 / 行）、遮罩方式、每单位位移与 stagger。

### 7.3 颜色与令牌

```js
(() => { const out = {}; for (const sh of document.styleSheets) { try { for (const r of sh.cssRules) { if (r.selectorText === ':root' || r.selectorText === 'html') for (const p of r.style) if (p.startsWith('--')) out[p] = r.style.getPropertyValue(p).trim(); } } catch (e) {} } return out; })();
```

- 有 CSS 变量：保留语义名映射到 `TK-xxx`。
- 无变量：从关键元素 computed style 聚类得出色板，标 `【推断：computed style 聚类】`。
- 颜色统一写 HEX + 透明度，并附 OKLCH 值；渐变写完整 `linear-gradient()` / `radial-gradient()` 参数，色标引用 TK-C 编号。
- 每个颜色令牌写语义角色（底色 / 次表面 / 主文字 / 次文字 / 强调 / 强调上文字 / 边框 / 状态色 / 渐变色标 / GL 专用）与使用位置，供阶段 3.5 按角色重映射。
- 不同页面或区块使用不同明暗主题时，分别列出主题组（如 `theme-dark`、`theme-light`）及切换规则。

### 7.4 材质图层拆解

玻璃、金属、噪点、光晕、颗粒、描边光、投影：一律拆成按 z 序排列的图层表（写入提示词 §3.6）：

| z 序 | 层名 | 实现方式 | 精确参数 | 混合模式 | 不透明度 | 证据 |
|---|---|---|---|---|---|---|
| 1 | 底色 | CSS background | `rgba(255,255,255,0.06)` | normal | 1 | |
| 2 | 背景模糊 | backdrop-filter | `blur(24px) saturate(140%)` | — | — | |
| 3 | 内高光 | box-shadow inset | `inset 0 1px 0 rgba(255,255,255,0.25)` | normal | 1 | |
| 4 | 噪点 | 平铺 PNG / SVG feTurbulence | `baseFrequency 0.9, numOctaves 2`，尺寸 200px | overlay | 0.04 | |
| 5 | 光晕 | radial-gradient / Shader | 中心、半径、颜色、模糊 | screen | 0.6 | |

材质表中的颜色一律引用 TK-C 编号。金属、液态、折射、彩虹色散等由着色器实现的材质：写在核心机制合同内，列 uniform 与取值。表中示例值仅为格式示范，实际必须逐项实测或标注。

### 7.5 其余尺度

圆角、边框、阴影、z-index 层级、模糊值、过渡时长与缓动，全部收敛成令牌表（提示词 §3），每项给使用位置。

