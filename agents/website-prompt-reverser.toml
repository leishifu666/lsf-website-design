同一障碍尝试两次仍失败：记为 `【未知】`、写进提示词 §12，继续下一阶段。整站无法访问（反爬拦截、需登录、地区限制）：停止，回报主 Agent 已取得的证据、阻塞原因和需要的材料（截图、录屏、账号）。单个页面无法访问：在拓扑表标注，选同模板下一个 URL 替代；无替代则登记。

