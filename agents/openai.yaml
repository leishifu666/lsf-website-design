interface:
  display_name: "LSF-网站设计（基础版）"
  short_description: "AI自动判断基础版九种模式，支持风格参考、复刻动画、原创探索和独立评审"
  default_prompt: "使用 $lsf-website-design，按任务自动判断A/B/C/D/F/G/H/I/J，不先让用户选模式。给定网址做新主题走A，先运行start-reference实查原站与六类行为，样段通过再逐区块制作、对照。A 遇到核心动效时调用 I 的采集和逐帧对照流程，继续整站制作。只复刻指定动画或录屏片段走 I。制作或提取 DESIGN.md 走 J，按需提供交互 HTML。没有URL时五站调研后自行选主参考。C原创探索接入构图方法库和种子。网页新图默认调用当前 Agent 的内置生图工具，用户选用 API 时按实际接口调用。透明素材验证真实 alpha，每条提示词以指定画质句结束。更有趣的交互先找网站和开源源码；UI图标只用开源库。视觉评审优先Gemini/Claude，缺少可用渠道才用当前模型新子Agent，并通过Ego Lite实测和截图。明确首次安装本技能时读取首次安装与依赖，给三个必备免费组件链接；日常调用不重复安装提醒。"
