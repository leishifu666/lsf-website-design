## 8. 协议 D：分层视觉资产与生图提示词工程

### 8.1 资产清点

按页面逐一列出所有图片、视频、3D 模型、插画、装饰图形：`IMG-xx`、所在页面与区块、页面锚点、原形态（照片 / 渲染图 / 实时 3D / 视频 / 矢量）、显示尺寸（三视口）、宽高比、遮挡关系、运动方式、是否跨页复用（如列表卡片图与 L2 头图为同一资产并参与 PT 共享元素转场，必须标为同一 `IMG-xx`）。

L2 模板需规划：详情页头图、图文画廊（按代表页实际张数与比例）、正文插图、透明前景物、上下篇预览图。动态路由的多条内容数据共用同一组版式，资产按「代表页实际数量」规划，并写明扩展到更多条目时的命名规则 `IMG-L2-<条目序号>-<位置>`。

### 8.2 形态判定

| 条件（满足任一） | 规划为 |
|---|---|
| 跨区块出现；压在文字上或被文字压住；独立视差 / 旋转 / 跟随指针；需与其他层前后穿插；在多种背景上复用 | 透明底单体 |
| 铺满区块；带环境光影氛围；整体随区块移动或整体视差；作为 canvas 纹理底图；参与共享元素转场的卡片/头图 | 完整环境图 |
| 原站为实时 3D 且有交互、实时光照或滚动驱动形变 | 保留实时 3D（重新建模或程序化几何）；生图只用于其纹理、海报降级帧 |
| 原站为视频 | 保留视频形态；生图用于首帧海报与分镜参考，标注视频源 `【未知】` 或替代方案 |
| 纯几何装饰、线条、网格 | CSS / SVG / Shader，不生图 |

一张原图若同时有主体运动和背景，拆成「完整环境图 + 透明底单体」两层，并分别标注原站形态与建议拆层方案。透明底单体的投影不画进图里，用 CSS 或单独的阴影层实现，并写参数。

### 8.3 视觉设定集（写入提示词 §8.1，所有生图提示词的统一基准）

逐项写死，每条生图提示词把相关项原文写进去，不写“按设定集”：
- 视角与机位：俯仰角（度）、相机高度、主体朝向。
- 焦段与景深：等效焦段 mm、景深范围。
- 主光：方位（时钟方向 + 高度角）、软硬、色温 K；补光与轮廓光同样写。
- 环境色与背景色：HEX，对应 TK-C 编号。
- 材质库：每种材质的基色 HEX、粗糙度描述、反射特征、透明度。
- 画风：写实摄影 / 3D 渲染 / 插画，统一一种；颗粒与对比度。
- 留白方向：主体在画面中的位置，给文字留出的区域。

### 8.4 单条资产写法（写入提示词 §8.2）

```
IMG-03「名称」
页面：PAGE-L1-01/SEC-02；跨页：同一资产作为 PAGE-L2-01/SEC-01 头图，参与 PT-02
用途：首屏右侧主体，跨入 SEC-03 上沿 120px；z-index 3，压在背景 IMG-01 之上、标题之下
形态：透明底单体
运动：TL-02 中 yPercent 0→-18（scrub），指针跟随旋转 ±4°（lerp 0.08）
显示尺寸：@1440 640×800 / @768 420×525 / @375 300×375；导出 @2x
工具参数（映射到当前原生生图工具或已选 API 对应字段）：size=1024x1280；transparent_background=true；output_format=png；quality=high；n=2
提示词：
<主体是什么>。<形态、结构、材质细节、颜色 HEX>。<视角、俯仰角、焦段、构图、主体占画面比例与留白方向>。<主光方位、软硬、色温 K，补光与轮廓光>。<背景：纯透明背景，真实 alpha 通道，完整主体，无地面、无投影、无相框、无伪棋盘格、无文字、无标志、无水印，边缘干净>。<与设定集一致的画风与颗粒>。画面干净通透，材质完整自然，纹理平滑统一，主体清晰，避免过度锐化、色斑、噪点、碎纹、崩坏和畸变。
后处理：裁到主体外扩 4% 透明边距；导出 png（保留 alpha）+ webp（含 alpha）；检查真实 alpha 通道及深浅底边缘无白边
```

规则：
- 一条提示词只生成一个资产。
- 正文不出现文字、Logo、商标、真人肖像。
- 完整环境图写 `transparent_background=false`，并写画面里给前景单体或文字预留的空位位置。
- 结尾句按 §2.5，句后不得有任何字符。

